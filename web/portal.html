<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务门户</title>
<style>
  :root { --bg:#0e141b; --card:#1a2430; --line:#2a3848; --accent:#4da3ff;
          --ok:#3ecf8e; --warn:#ffb454; --muted:#8aa0b4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:var(--bg); color:#e8eef4;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center;
         padding:48px 18px; }
  header { text-align:center; margin-bottom:34px; }
  h1 { font-size:25px; margin:0 0 8px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13.5px; line-height:1.6; }
  .grid { display:grid; gap:16px; width:100%; max-width:840px;
          grid-template-columns:repeat(auto-fit, minmax(252px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:20px; text-decoration:none; color:inherit; display:flex;
          flex-direction:column; transition:.18s; position:relative; overflow:hidden; }
  .card:hover { border-color:var(--accent); transform:translateY(-3px);
                box-shadow:0 10px 28px #0006; }
  .card::after { content:''; position:absolute; inset:0; border-radius:16px;
                 background:linear-gradient(135deg, #4da3ff14, transparent 60%);
                 opacity:0; transition:.18s; pointer-events:none; }
  .card:hover::after { opacity:1; }
  .ico { font-size:30px; margin-bottom:12px; }
  .card h2 { font-size:16.5px; margin:0 0 7px; }
  .card p { font-size:12.5px; color:var(--muted); line-height:1.65; margin:0;
            flex:1; }
  .go { margin-top:15px; font-size:13px; font-weight:700; color:var(--accent);
        display:flex; align-items:center; gap:6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .tag { font-size:10.5px; padding:3px 9px; border-radius:20px;
         background:#243547; color:#9fc2e8; }
  .tag.live { background:#123c2a; color:var(--ok); }
  footer { margin-top:38px; font-size:12px; color:#5f7284; text-align:center;
           line-height:1.8; }
  footer code { background:#1a2430; padding:2px 7px; border-radius:5px;
                color:#9fc2e8; font-size:11.5px; }
</style>
</head>
<body>
<header>
  <h1>🧭 服务门户</h1>
  <div class="sub">个人自用 · 离线地图生成 & 轨迹分析 & 游戏</div>
</header>

<div class="grid">
  <a class="card" href="/gpx/">
    <div class="ico">📦</div>
    <h2>GPX 工具</h2>
    <p>上传 GPX 生成离线地图（.gpkg / .mbtiles）导入 Avenza / Guru Maps；
       或在 PC 端叠加多条 GPX / KML / KMZ 做轨迹回放与标注出图。</p>
    <div class="tags">
      <span class="tag live">● 运行中</span>
      <span class="tag">离线地图</span>
      <span class="tag">轨迹回放</span>
    </div>
    <div class="go">进入 →</div>
  </a>

  <a class="card" href="http://59.110.15.156:3000/">
    <div class="ico">🎮</div>
    <h2>Stronghold Protocol</h2>
    <p>横屏策略游戏，支持多人房间对战。移动端需横屏，桌面端直接访问。</p>
    <div class="tags">
      <span class="tag live">● 运行中</span>
      <span class="tag">多人对战</span>
    </div>
    <div class="go">进入 →</div>
  </a>
</div>

<footer>
  瓦片下载与离线地图仅供个人自用，请遵守瓦片源服务条款。<br>
  轨迹回放页纯前端运行，不消耗服务器资源。
</footer>
</body>
</html>
