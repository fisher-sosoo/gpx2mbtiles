services:
  gpx2mbtiles:
    build: .
    image: gpx2mbtiles:latest
    container_name: gpx2mbtiles
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      # 令牌目录独立于 data/：只放 Garmin 的 OAuth 令牌，账号密码不落盘
      GARMINTOKENS: /app/garmin_tokens
    volumes:
      - ./data:/app/data
      - ./garmin_tokens:/app/garmin_tokens