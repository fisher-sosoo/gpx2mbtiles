services:
  gpx2mbtiles:
    build: .
    image: gpx2mbtiles:latest
    container_name: gpx2mbtiles
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
