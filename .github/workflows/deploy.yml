name: Deploy on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight - 检查 Secrets 是否配置
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing SSH_USER"
          [ -z "$SSH_PASSWORD" ] && missing="$missing SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets:$missing"
            echo "请在 Settings → Secrets and variables → Actions 中配置。"
            exit 1
          fi
          echo "Secrets 已配置（host 长度 ${#SSH_HOST}，password 长度 ${#SSH_PASSWORD}）"

      - name: 探测 SSH 端口连通性
        run: |
          echo "探测 ${{ secrets.SSH_HOST }}:22022 ..."
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.SSH_HOST }}/22022"; then
            echo "SSH 端口 22022 可达"
          else
            echo "::error::无法连接 ${{ secrets.SSH_HOST }}:22022（安全组未放行或 IP 被封）"
            exit 1
          fi

      - name: Deploy with auto-rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22022
          command_timeout: 30m
          script_stop: false
          debug: true
          script: |
            echo "=== Runner 已连上服务器 ==="
            TAG="${{ github.ref_type == 'tag' && github.ref_name || 'origin/main' }}"
            APP_DIR=/opt/gpx2mbtiles
            LAST_FILE=$APP_DIR/.last_success
            HEALTH_URL=http://127.0.0.1:8000/api/health

            echo "=== Deploying: $TAG ==="
            cd $APP_DIR || exit 1

            # 部署机不应有本地改动；残留的手工改动会让 checkout 直接失败
            # （曾导致连续三次部署失败且原因不可见）。这里先丢弃已跟踪文件的改动，
            # 未跟踪的运行时文件（.last_success / scripts/*.py）保持不动。
            if ! git diff --quiet; then
              echo "=== 丢弃部署机上的本地改动 ==="
              git diff --name-only
              git checkout -- . || exit 1
            fi

            # 部署机上的本地 tag 若与远端同名但指向不同提交，git fetch 会拒绝更新
            # 并返回非零，从而中断整个部署（实际发生过：v1.2.3/v1.2.4 被重建后
            # 服务器上仍是旧对象）。--force 让远端 tag 覆盖本地，事后清理本地多余 tag。
            git tag -l | while read -r t; do
              if ! git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1; then
                echo "清理远端已不存在的本地 tag: $t"
                git tag -d "$t" >/dev/null
              fi
            done

            # 服务器 git 走 mihomo 代理。实测 7893 会偶发不可用（曾导致两次部署失败），
            # 而 7890/7891 往往还是通的 —— 所以按端口轮换重试，别把可用性绑在单点上。
            # 服务器上没有 nc，别做端口预检，直接逐个试（失败就换下一个）
            FETCH_OK=0
            for p in 7893 7890 7891; do
              echo "尝试代理端口 $p ..."
              git config http.proxy "http://127.0.0.1:$p"
              if git fetch --tags --force --prune; then
                FETCH_OK=1
                echo "fetch 成功（代理端口 $p）"
                break
              fi
              echo "端口 $p fetch 失败，换下一个"
            done

            if [ "$FETCH_OK" != "1" ]; then
              echo "::error::git fetch 在所有代理端口上都失败"
              echo "现有 HEAD: $(git log --oneline -1)"
              exit 1
            fi

            # 确认目标版本确实存在，避免拿到过期代码却以为部署成功
            if ! git rev-parse --verify --quiet "$TAG^{commit}" >/dev/null; then
              echo "::error::找不到版本 $TAG（fetch 后仍不存在）"
              exit 1
            fi

            git checkout "$TAG" || exit 1
            echo "HEAD: $(git log --oneline -1)"

            # 部署门户主页：仓库内 web/portal.html -> /srv/portal/index.html
            # （门户不在容器里，由 Caddy file_server 直接提供，故需单独同步）
            if [ -f "$APP_DIR/web/portal.html" ]; then
              mkdir -p /srv/portal
              install -m 0644 "$APP_DIR/web/portal.html" /srv/portal/index.html
              echo "门户已同步: $(wc -c < /srv/portal/index.html) 字节"
            else
              echo "::warning::未找到 web/portal.html，跳出门户同步"
            fi

            echo "=== Building ==="
            if docker compose build --pull; then
              echo "=== Starting ==="
              docker compose up -d
              for i in $(seq 1 30); do
                if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                  echo "$TAG" > "$LAST_FILE"
                  echo "=== Deploy SUCCESS: $TAG (after ~$((i*2))s) ==="
                  exit 0
                fi
                sleep 2
              done
              echo "=== Health check FAILED after 60s ==="
            else
              echo "=== Build FAILED ==="
            fi

            echo "=== Rolling back ==="
            if [ ! -f "$LAST_FILE" ]; then
              echo "::error::无回滚目标（$LAST_FILE 不存在）"
              exit 1
            fi
            PREV=$(cat "$LAST_FILE")
            echo "Rollback to: $PREV"
            git checkout "$PREV" || exit 1
            docker compose build --pull || exit 1
            docker compose up -d || exit 1
            for i in $(seq 1 30); do
              if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                echo "=== Rollback SUCCESS: $PREV ==="
                exit 1
              fi
              sleep 2
            done
            echo "::error::回滚后仍不健康，需人工介入"
            exit 1
